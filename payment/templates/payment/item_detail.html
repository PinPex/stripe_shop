<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Buy {{ item.name }}</title>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; }
        .item-box { border: 1px solid #ddd; padding: 20px; border-radius: 8px; }
        button { background: #5469d4; color: white; border: none; padding: 12px 24px; 
                 border-radius: 4px; font-size: 16px; cursor: pointer; width: 100%; }
        button:hover { background: #3f4c9a; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        #payment-message { margin-top: 20px; padding: 10px; border-radius: 4px; display: none; }
        .error { color: #dc3545; background: #f8d7da; border: 1px solid #f5c6cb; }
        .success { color: #28a745; background: #d4edda; border: 1px solid #c3e6cb; }
    </style>
</head>
<body>
    <div class="item-box">
        <h1>{{ item.name }}</h1>
        <p>{{ item.description }}</p>
        <p style="font-size: 24px; font-weight: bold;">${{ item.display_price }}</p>
        
        <div id="payment-element"></div>
        <button id="buy-button">Pay Now</button>
        <div id="payment-message"></div>
    </div>

    <script>
        const stripe = Stripe('{{ stripe_pub_key }}');
        let elements = null;
        let clientSecret = null;
        
        const buyButton = document.getElementById('buy-button');
        const paymentMessage = document.getElementById('payment-message');
        
        function createPaymentElement(clientSecret) {
            if (elements) {
                elements.destroy();
            }
            
            elements = stripe.elements({
                clientSecret: clientSecret,
                appearance: {
                    theme: 'stripe',
                    variables: {
                        colorPrimary: '#5469d4',
                        colorBackground: '#ffffff',
                        colorText: '#30313d',
                        fontFamily: 'Arial, sans-serif',
                    },
                },
            });
            
            const paymentElement = elements.create('payment');
            paymentElement.mount('#payment-element');
        }
        
        buyButton.addEventListener('click', function() {
            buyButton.disabled = true;
            buyButton.textContent = 'Processing...';
            paymentMessage.style.display = 'none';
            
            fetch('/buy/{{ item.id }}/', {method: 'GET'})
                .then(response => response.json())
                .then(data => {
                    if (data.clientSecret) {
                        clientSecret = data.clientSecret;
                        createPaymentElement(clientSecret);
                        buyButton.textContent = 'Confirm Payment';
                        buyButton.disabled = false;
                        
                        buyButton.onclick = confirmPayment;
                    } else {
                        showMessage('Error: ' + (data.error || 'Unknown error'), 'error');
                        buyButton.textContent = 'Pay Now';
                        buyButton.disabled = false;
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    showMessage('Payment error occurred', 'error');
                    buyButton.textContent = 'Pay Now';
                    buyButton.disabled = false;
                });
        });
        
        function confirmPayment() {
            buyButton.disabled = true;
            buyButton.textContent = 'Confirming...';
            
            stripe.confirmPayment({
                elements: elements,
                confirmParams: {
                    return_url: '{{ request.scheme }}://{{ request.get_host }}/success/',
                },
                redirect: 'if_required',
            })
            .then(result => {
                if (result.error) {
                    showMessage(result.error.message, 'error');
                    buyButton.disabled = false;
                    buyButton.textContent = 'Confirm Payment';
                } else {
                    showMessage('Payment successful! Redirecting...', 'success');
                    setTimeout(() => {
                        window.location.href = '/success/';
                    }, 1500);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                showMessage('Payment confirmation failed', 'error');
                buyButton.disabled = false;
                buyButton.textContent = 'Confirm Payment';
            });
        }
        
        function showMessage(message, type) {
            paymentMessage.textContent = message;
            paymentMessage.className = type;
            paymentMessage.style.display = 'block';
        }
    </script>
</body>
</html>
